<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login — Gestão Financeira</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card" aria-labelledby="login-title">

            <header class="login-header">
                <h1 id="login-title">Gestão Financeira</h1>
                <p>Acesse sua conta</p>
            </header>

           <form id="login-form">
    <label for="email">
        Gmail
    </label>

    <input
        id="email"
        type="email"
        placeholder="usuario@gmail.com"
        autocomplete="email"
        required
    >

    <label for="password">
        Senha
    </label>

    <input
        id="password"
        type="password"
        placeholder="Digite sua senha"
        autocomplete="current-password"
        required
    >

    <p id="login-error" class="login-error" hidden></p>

    <button type="submit" id="login-button">
        Entrar
    </button>

    <button type="button" id="show-register">
        Criar uma conta
    </button>
</form>


<form id="register-form" hidden>

    <h2>Criar conta</h2>

    <label for="register-name">
        Nome
    </label>

    <input
        id="register-name"
        type="text"
        placeholder="Seu nome"
        autocomplete="name"
        required
    >

    <label for="register-email">
        Gmail
    </label>

    <input
        id="register-email"
        type="email"
        placeholder="usuario@gmail.com"
        autocomplete="email"
        required
    >

    <label for="register-password">
        Senha
    </label>

    <input
        id="register-password"
        type="password"
        placeholder="Crie uma senha"
        autocomplete="new-password"
        minlength="6"
        required
    >

    <label for="register-password-confirm">
        Confirmar senha
    </label>

    <input
        id="register-password-confirm"
        type="password"
        placeholder="Digite a senha novamente"
        autocomplete="new-password"
        minlength="6"
        required
    >

    <p id="register-error" class="login-error" hidden></p>

    <button type="submit" id="register-button">
        Criar conta
    </button>

    <button type="button" id="show-login">
        Já tenho uma conta
    </button>

            </form>

            <footer class="login-footer">
                <p>Controle suas receitas e despesas de forma simples.</p>
            </footer>

        </section>

    </main>

    <script src="login.js"></script>

</body>

</html>
